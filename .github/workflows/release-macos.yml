name: Publish macOS DMG

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: stable
      DMG_PATH: src-tauri/target/universal-apple-darwin/release/bundle/dmg/mardi-macos-universal.dmg
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'

      - name: Check release tag
        id: release
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Release tag must match Tauri version v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build universal DMG
        env:
          APPLE_SIGNING_IDENTITY: '-'
          MARDI_VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm ci
          npm run tauri build -- --target universal-apple-darwin --bundles dmg -- --locked
          dmg_dir="$(dirname "$DMG_PATH")"
          cp "$dmg_dir/mardi_${MARDI_VERSION}_universal.dmg" "$DMG_PATH"
          hdiutil verify "$DMG_PATH"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$DMG_PATH" --verify-tag --generate-notes --latest
